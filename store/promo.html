<!doctype html>
<!--
  商店宣传图的模板。用浏览器打开 promo.html?size=intro|marquee|small，把窗口内容区调到对应尺寸（1280×800、1400×560、440×280）截图，
  分别存成 screenshot-0-intro.png、promo-marquee-1400x560.png、promo-small-440x280.png。
  src/popup-home.png 是扩展面板首页的 2 倍截图（340×464 的面板，深色主题）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NovelAI中文化助手 宣传图</title>
<style>
  :root { --cream: #f5f3c2; --lav: #d9dcff; --muted: #9ea3c2; --card: #1f2238; --line: #34385a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: var(--w); height: var(--h); overflow: hidden; color: #eef0fb; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(120% 90% at 0% 0%, #34377c 0%, #1d1f45 45%, #121327 100%); position: relative; }
  body::before { content: ""; position: absolute; inset: 0; opacity: .5;
    background: radial-gradient(40% 50% at 85% 30%, #5b4fb244, transparent 70%), radial-gradient(35% 45% at 70% 95%, #f5f3c214, transparent 70%); }
  .intro { --w: 1280px; --h: 800px; }
  .marquee { --w: 1400px; --h: 560px; }
  .small { --w: 440px; --h: 280px; }

  .copy { position: absolute; display: flex; flex-direction: column; }
  .icon { width: 104px; height: 104px; margin: -8px; filter: drop-shadow(0 14px 18px #0009); }
  h1 { margin: 26px 0 0; color: var(--cream); font-size: 62px; line-height: 1.1; font-weight: 800; letter-spacing: -1px; }
  .tagline { margin-top: 16px; color: var(--lav); font-size: 22px; opacity: .9; }
  .features { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 34px; width: 520px; }
  .feature { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: #1f223888; backdrop-filter: blur(6px); }
  .feature b { display: block; font-size: 17px; color: #fff; }
  .feature span { font-size: 13px; color: var(--muted); }

  .stage { position: absolute; }
  .popup { position: absolute; width: 340px; border-radius: 18px; box-shadow: 0 40px 80px -30px #000e, 0 0 0 1px #ffffff1a; }
  .float { position: absolute; padding: 10px 0; border: 1px solid var(--line); border-radius: 14px; background: #1b1d33; box-shadow: 0 24px 50px -24px #000e; font-size: 15px; }
  .float .q { padding: 0 16px 6px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
  .float .row { padding: 8px 16px; }
  .float .row + .row { border-top: 1px solid #ffffff10; }
  .float .en { color: var(--cream); font-size: 17px; }
  .float .zh { color: var(--muted); font-size: 12px; }
  .chips { position: absolute; display: flex; flex-wrap: wrap; gap: 6px; width: 300px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #0e0f21f2; box-shadow: 0 24px 50px -24px #000e; }
  .chip { display: inline-flex; flex-direction: column; padding: 4px 9px; border-radius: 6px; background: #ffffff1f; }
  .chip b { font-size: 14px; font-weight: 500; line-height: 1.25; }
  .chip span { font-size: 11px; opacity: .6; }
  .chip.typo b { color: #f5c518; }
  .chip.none { opacity: .5; }

  /* 1280×800：左边文字和功能，右边面板和两张浮动卡片 */
  .intro .copy { left: 96px; top: 150px; }
  .intro .stage { left: 760px; top: 110px; width: 460px; height: 600px; }
  .intro .popup { left: 70px; top: 0; }
  .intro .suggest { left: -60px; top: 330px; width: 240px; }
  .intro .chips { left: 150px; top: 470px; }

  /* 1400×560：文字和面板并排，去掉功能卡片的第二行说明 */
  .marquee .copy { left: 110px; top: 128px; }
  .marquee h1 { font-size: 64px; }
  .marquee .features { width: 560px; margin-top: 28px; }
  .marquee .feature span { display: none; }
  .marquee .stage { left: 900px; top: 60px; width: 420px; height: 480px; }
  .marquee .popup { left: 60px; top: 0; width: 300px; }
  .marquee .suggest { left: -70px; top: 230px; width: 230px; }
  .marquee .chips { display: none; }

  /* 440×280：只放图标、名称和一句话 */
  .small .copy { left: 0; right: 0; top: 46px; align-items: center; text-align: center; }
  .small .icon { width: 84px; height: 84px; margin: -6px; }
  .small h1 { margin-top: 16px; font-size: 34px; }
  .small .tagline { margin-top: 10px; font-size: 14px; }
  .small .features, .small .stage { display: none; }
</style>
</head>
<body>
<div class="copy">
  <img class="icon" src="icon-128.png" alt="">
  <h1>NovelAI中文化助手</h1>
  <div class="tagline">打中文找标签，英文标签附中文，界面也能换成中文</div>
  <div class="features">
    <div class="feature"><b>中文联想标签</b><span>输入「猫娘」联想出 cat girl</span></div>
    <div class="feature"><b>英文标签释义</b><span>NovelAI 联想的每一项附上中文</span></div>
    <div class="feature"><b>标签中文对照</b><span>别人分享的提示词也能一眼看懂</span></div>
    <div class="feature"><b>界面汉化</b><span>按钮、设置和教程显示为中文</span></div>
  </div>
</div>
<div class="stage">
  <img class="popup" src="src/popup-home.png" alt="">
  <div class="float suggest">
    <div class="q">猫娘</div>
    <div class="row"><div class="en">cat girl</div><div class="zh">猫娘</div></div>
    <div class="row"><div class="en">nekopara</div><div class="zh">猫娘乐园</div></div>
  </div>
  <div class="chips">
    <span class="chip"><b>暗黑盔甲</b><span>dark armor</span></span>
    <span class="chip"><b>戏剧性天空</b><span>dramatic sky</span></span>
    <span class="chip"><b>画师</b><span>artist:wlop</span></span>
    <span class="chip typo"><b>最差质量</b><span>worth quality</span></span>
    <span class="chip"><b>极长发</b><span>(long hair:1.5)</span></span>
  </div>
</div>
<script>
  document.body.className = new URLSearchParams(location.search).get('size') || 'intro';
</script>
</body>
</html>
