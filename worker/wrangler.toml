# 部署步骤见 worker/README.md
name = "novelai-cn"
main = "src/index.js"
compatibility_date = "2026-10-01"
# 自定义域名，所在的域（000.moe）要在同一个 Cloudflare 账号里；改域名时同步改 package.json 的 nzh.communityUrl
routes = [{ pattern = "novelai.000.moe", custom_domain = true }]

# 不用定时任务：Danbooru 拒绝来自 Workers 的请求，新标签由 GitHub Actions 拉（.github/workflows/sync-tags.yml）
[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "novelai-cn"
# npx wrangler d1 create novelai-cn 输出的 database_id；自己部署一份时换成你的
database_id = "39cf83df-e481-41e9-a277-f0d93609ec31"

[vars]
# 提交页用来搜索的词典，默认是仓库 main 分支上的 dist/zh-tags.tsv
# DICT_URL = "https://raw.githubusercontent.com/TomorrowX6/NovelAI-CN/main/dist/zh-tags.tsv"
# 可选：Cloudflare Turnstile 人机验证的站点密钥；同时要用 wrangler secret put TURNSTILE_SECRET 设置密钥
# TURNSTILE_SITE_KEY = ""

# 机密（用 npx wrangler secret put 名字 设置，不要写在这里）：
#   ADMIN_TOKEN       审核页口令
#   IP_SALT           给 IP 加盐哈希用的随机串
#   TURNSTILE_SECRET  可选，配合 TURNSTILE_SITE_KEY
