name: Release

# 推送版本号标签（如 1.7.1，要和 package.json 的 version 一致）时构建并发布 GitHub Release，附上：
#   novelai-zh-tags.user.js      用户脚本
#   novelai-zh-tags-版本-chrome.crx / .zip    Chrome：用私钥签名的安装包 / 上架 Chrome 应用商店用的压缩包
#   novelai-zh-tags-版本-edge.crx / .zip      Edge：和 Chrome 同一个包，zip 上架 Edge 加载项商店
#   novelai-zh-tags-版本-firefox.zip / .xpi   Firefox：上架附加组件站（AMO）用的压缩包 / 同一个包换成 xpi 扩展名（未签名）
# 也可以在 Actions 页手动运行：只构建、不发布，产物在运行页的 Artifacts 里下载。
# 签名私钥放在仓库 Settings → Secrets 的 CRX_PRIVATE_KEY（.keys/novelai-zh-tags.pem 的全文）。
# 扩展 ID 由私钥决定，scripts/crx.mjs 会核对它和 package.json 的 nzh.extensionId 是否一致。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check tag matches package.json
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 package.json 的版本 $VERSION 不一致"
            exit 1
          fi
      - name: Build
        run: node scripts/build.mjs
      - name: Check dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            git diff --stat -- dist
            echo "::error::dist/ 与源码不一致，请运行 npm run build 后提交"
            exit 1
          fi
      - name: Search regression tests
        run: node scripts/test.mjs
      - name: Extension popup tests
        run: node scripts/test-popup.mjs
      - name: Package extension
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::没有设置 CRX_PRIVATE_KEY，不能用正式私钥签名"
            exit 1
          fi
          export CRX_KEY="$RUNNER_TEMP/crx.pem"
          trap 'rm -f "$CRX_KEY"' EXIT
          (umask 077 && printf '%s\n' "$CRX_PRIVATE_KEY" > "$CRX_KEY")
          node scripts/crx.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: novelai-zh-tags-${{ steps.version.outputs.version }}
          path: |
            dist/novelai-zh-tags.user.js
            build/novelai-zh-tags-${{ steps.version.outputs.version }}-*.crx
            build/novelai-zh-tags-${{ steps.version.outputs.version }}-*.zip
            build/novelai-zh-tags-${{ steps.version.outputs.version }}-*.xpi
          if-no-files-found: error
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(dist/novelai-zh-tags.user.js)
          for f in chrome.crx chrome.zip edge.crx edge.zip firefox.zip firefox.xpi; do
            files+=("build/novelai-zh-tags-$VERSION-$f")
          done
          # 已经手动建好同名 Release 时只补上附件
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" "${files[@]}" --clobber
          else
            gh release create "$VERSION" "${files[@]}" --title "V$VERSION" --generate-notes
          fi
