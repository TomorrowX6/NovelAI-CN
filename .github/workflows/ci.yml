name: CI

on:
  push:
    # 编辑器（worker/）每次修改社区译名都是一个提交，只改了这个文件时不用构建
    paths-ignore:
      - data/zh-community.tsv
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs
      - name: Search regression tests
        run: node scripts/test.mjs
      - name: Community platform tests
        run: node scripts/test-worker.mjs
      - name: Extension popup tests
        run: node scripts/test-popup.mjs
      - name: Browser runtime tests
        run: node scripts/test-runtime.mjs
      - name: Check dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            git diff --stat -- dist
            echo "::error::dist/ 与源码不一致，请运行 npm run build 后提交"
            exit 1
          fi

